name: Premium branch smoke
on:
  push:
    branches:
      - feature/amnezia-premium-gateway

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner smoke
        run: |
          set -eux
          uname -a
          git --version
          go version || true
          node --version || true
          npm --version || true
